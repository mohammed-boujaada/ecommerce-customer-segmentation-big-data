services:

  jupyter:
    image: quay.io/jupyter/pyspark-notebook:latest
    container_name: customer-segmentation-jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./project:/home/jovyan/work
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 192.168.8.1
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_SUBMIT_ARGS: "--packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0 pyspark-shell"

  kafka:
    image: apache/kafka:latest
    container_name: customer-segmentation-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
